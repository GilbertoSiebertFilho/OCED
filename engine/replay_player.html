<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__ · OCED harvest replay</title>
<style>
/* OCED harvest replay: the app's palette (app/brand.py), the system sans-serif (no external font), light theme */
:root {
  --navy: #00358E; --navy-2: #00266B; --blue: #009CDE; --blue-text: #0077B6; --green: #00B373; --orange: #F5A623;
  --text: #1F2937; --muted: #4B5563; --rule: #D7E3F2; --bg2: #F3F7FC; --glass: rgba(255,255,255,0.94);
  --glass-edge: rgba(0,53,142,0.14); --shadow: 0 1px 2px rgba(16,24,40,0.06), 0 10px 30px rgba(0,38,107,0.16);
  --radius: 14px; --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #E9EEF2; color: var(--text); font-family: var(--font);
  -webkit-font-smoothing: antialiased; }
.rp { position: relative; width: 100%; height: 100vh; overflow: hidden; background: #E6ECE6; user-select: none;
  -webkit-user-select: none; touch-action: none; border-radius: 0; }
.rp.embedded { border-radius: 12px; }
.rp:fullscreen { width: 100vw; height: 100vh; border-radius: 0; }
.rp canvas.map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
.rp canvas.map.drag { cursor: grabbing; }
.glass { background: var(--glass); border: 1px solid var(--glass-edge); border-radius: var(--radius);
  box-shadow: var(--shadow); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }

/* ---- the title card and the clock (top left) */
.rp-head { position: absolute; left: 14px; top: 14px; padding: 12px 16px 12px 14px; max-width: min(420px, 62%);
  display: flex; gap: 12px; align-items: stretch; }
.rp-head .bar { width: 5px; border-radius: 4px; background: linear-gradient(180deg, var(--navy), var(--blue)); }
.rp-kicker { font-size: 11px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--blue-text); }
.rp-title { font-size: 15px; font-weight: 700; color: var(--navy); margin-top: 1px; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; max-width: 360px; }
.rp-clock { display: flex; align-items: baseline; gap: 10px; margin-top: 6px; }
.rp-time { font-size: 30px; font-weight: 800; color: var(--text); font-variant-numeric: tabular-nums; letter-spacing: .01em;
  line-height: 1; }
.rp-date { font-size: 13px; font-weight: 600; color: var(--muted); }
.rp-zone { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
.rp-note { margin-top: 7px; font-size: 11.5px; line-height: 1.35; color: #7A4A00; background: #FFF4DE; border: 1px solid #F5D49A;
  border-radius: 8px; padding: 5px 8px; }
.rp-note:empty { display: none; }
.rp-idle-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; color: var(--blue-text);
  background: #E6F5FC; border-radius: 999px; padding: 2px 8px; margin-left: 2px; vertical-align: middle; }
.rp-idle-chip[hidden] { display: none; }

/* ---- map buttons (top right) */
.rp-tools { position: absolute; right: 14px; top: 14px; display: flex; flex-direction: column; gap: 8px; z-index: 3; }
.rp-tools .grp { display: flex; flex-direction: column; overflow: hidden; padding: 0; }
.tbtn { width: 40px; height: 40px; border: 0; background: transparent; color: var(--navy); display: grid; place-items: center;
  cursor: pointer; transition: background .15s, color .15s; }
.tbtn + .tbtn { border-top: 1px solid var(--rule); }
.tbtn:hover { background: #EAF2FC; }
.tbtn:active { background: #D9E8FA; }
.tbtn.on { background: var(--navy); color: #fff; }
.tbtn svg { width: 20px; height: 20px; }
.tbtn:focus-visible, .btn:focus-visible, .seg button:focus-visible, .chip:focus-visible, select:focus-visible {
  outline: 2px solid var(--blue); outline-offset: 1px; }

/* ---- the live panel (right) */
.rp-panel { position: absolute; right: 66px; top: 14px; width: 292px; max-height: calc(100% - 196px); overflow: auto;
  padding: 12px 12px 10px; z-index: 2; scrollbar-width: thin; }
.rp-panel[hidden] { display: none; }
.ph { display: flex; align-items: center; justify-content: space-between; font-size: 11px; font-weight: 800;
  letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 2px 2px 8px; }
.cmb { border: 1px solid var(--rule); border-radius: 11px; padding: 7px 9px 6px; margin-bottom: 6px; background: #fff;
  transition: border-color .15s, box-shadow .15s; }
.cmb.followed { border-color: var(--blue); box-shadow: 0 0 0 2px rgba(0,156,222,.18); }
.cmb .top { display: flex; align-items: center; gap: 8px; }
.num { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12.5px; font-weight: 800;
  color: #0B1B33; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.25); flex: none; }
.cname { font-weight: 700; font-size: 13.5px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cmake { display: block; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cmake .swatch { display: inline-block; vertical-align: -1px; margin-right: 5px; }
.cmb .top > .cmid { flex: 1; min-width: 0; }
.swatch { width: 10px; height: 10px; border-radius: 3px; border: 1px solid rgba(0,0,0,.25); flex: none; }
.state { margin-left: auto; font-size: 10.5px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase;
  border-radius: 999px; padding: 2px 7px; white-space: nowrap; }
.state.work { color: #00663F; background: #DDF6EC; }
.state.idle { color: #7A4A00; background: #FFF1D6; }
.state.wait, .state.done { color: #4B5563; background: #EEF1F5; }
.vals { display: flex; gap: 4px; margin-top: 6px; }
.vals .val { flex: 1; display: flex; align-items: baseline; gap: 4px; padding: 3px 7px; }
.val { background: var(--bg2); border-radius: 8px; padding: 4px 7px; min-width: 0; }
.val b { display: block; font-size: 14px; font-weight: 800; color: var(--text); font-variant-numeric: tabular-nums;
  white-space: nowrap; }
.vals .val b { display: inline; font-size: 13.5px; }
.val span { font-size: 10.5px; color: var(--muted); white-space: nowrap; }
.cmb .foot { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; font-size: 11.5px;
  color: var(--muted); gap: 6px; }
.linkbtn { border: 0; background: none; color: var(--blue-text); font-weight: 700; font-size: 11.5px; cursor: pointer;
  padding: 2px 4px; border-radius: 6px; font-family: inherit; }
.linkbtn:hover { background: #EAF2FC; }
.tot { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 4px 0 8px; }
.tot .val b { font-size: 16px; }
.prog { height: 6px; background: #E5ECF5; border-radius: 99px; overflow: hidden; margin: 2px 0 10px; }
.prog i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--navy), var(--blue)); border-radius: 99px; }
.rp-legend { position: absolute; left: 14px; width: 270px; padding: 10px 13px 10px; z-index: 2; }
.rp-legend .lt { font-size: 12.5px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
.ramp { height: 10px; border-radius: 5px; border: 1px solid rgba(0,0,0,.12); }
.ramp-l { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); margin-top: 3px;
  font-variant-numeric: tabular-nums; }
.lchips { display: flex; flex-direction: column; gap: 4px; }
.lchip { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text); }
.lchip .swatch { width: 12px; height: 12px; border-radius: 50%; }
.lchip em { font-style: normal; color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }
.small { font-size: 11px; color: var(--muted); line-height: 1.35; margin-top: 6px; }

/* ---- the control bar (bottom) */
.rp-bar { position: absolute; left: 14px; right: 14px; bottom: 14px; padding: 10px 14px 10px; z-index: 3; }
.tl-wrap { position: relative; }
canvas.tl { width: 100%; height: 58px; display: block; cursor: pointer; touch-action: none; }
.tl-tip { position: absolute; top: -26px; transform: translateX(-50%); background: var(--navy); color: #fff; font-size: 11.5px;
  font-weight: 700; padding: 3px 7px; border-radius: 6px; white-space: nowrap; pointer-events: none; opacity: 0;
  transition: opacity .12s; font-variant-numeric: tabular-nums; }
.tl-tip.show { opacity: 1; }
.ctl { display: flex; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; row-gap: 8px; }
.btn { height: 36px; min-width: 36px; padding: 0 9px; border: 1px solid var(--rule); background: #fff; color: var(--navy);
  border-radius: 10px; display: inline-grid; place-items: center; cursor: pointer; font-family: inherit; font-weight: 700;
  transition: background .15s, transform .1s, box-shadow .15s; }
.btn:hover { background: #EAF2FC; }
.btn:active { transform: translateY(1px); }
.btn svg { width: 18px; height: 18px; }
.btn.play { width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--navy); color: #fff;
  box-shadow: 0 6px 16px rgba(0,53,142,.35); }
.btn.play:hover { background: #0A47B3; box-shadow: 0 8px 20px rgba(0,53,142,.42); transform: translateY(-1px); }
.btn.play svg { width: 22px; height: 22px; }
.sep { width: 1px; height: 26px; background: var(--rule); }
.seg { display: inline-flex; background: var(--bg2); border: 1px solid var(--rule); border-radius: 10px; padding: 2px; gap: 2px; }
.seg button { border: 0; background: transparent; height: 30px; padding: 0 9px; border-radius: 8px; font-family: inherit;
  font-size: 12.5px; font-weight: 700; color: var(--navy); cursor: pointer; white-space: nowrap; }
.seg button:hover { background: #E2ECF8; }
.seg button.on { background: var(--navy); color: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.18); }
.lbl { font-size: 11px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 999px;
  border: 1px solid var(--rule); background: #fff; color: var(--text); font-size: 12.5px; font-weight: 600; cursor: pointer;
  font-family: inherit; white-space: nowrap; }
.chip .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #9AA6B5; display: grid; place-items: center; }
.chip.on { border-color: var(--blue); background: #EAF6FD; color: var(--navy); }
.chip.on .dot { border-color: var(--blue); background: var(--blue); box-shadow: inset 0 0 0 2px #fff; }
select.sel { height: 34px; border: 1px solid var(--rule); border-radius: 10px; background: #fff; color: var(--navy); font-weight: 700;
  font-family: inherit; font-size: 12.5px; padding: 0 8px; cursor: pointer; max-width: 170px; }
.spacer { flex: 1; }
.grp-i { display: inline-flex; align-items: center; gap: 6px; }
.only-narrow { display: none !important; }

/* ---- small things on the map */
.rp-attr { position: absolute; right: 14px; font-size: 10.5px; color: rgba(255,255,255,.92); text-shadow: 0 1px 2px rgba(0,0,0,.7);
  pointer-events: none; z-index: 1; max-width: 60%; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rp-attr.plain { color: #5B6573; text-shadow: none; }
.rp-scale { position: absolute; left: 14px; font-size: 11px; font-weight: 700; color: var(--text); pointer-events: none; z-index: 1;
  background: rgba(255,255,255,.88); border-radius: 8px; padding: 3px 8px 5px; box-shadow: 0 1px 4px rgba(0,0,0,.18); }
.rp-scale i { display: block; height: 5px; border: 2px solid var(--text); border-top: 0; margin-top: 2px; }
.toast { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); background: rgba(17,24,39,.88); color: #fff;
  font-size: 12.5px; padding: 7px 12px; border-radius: 9px; pointer-events: none; opacity: 0; transition: opacity .25s; z-index: 5;
  white-space: nowrap; }
.toast.show { opacity: 1; }
#rp-stats { display: none; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); max-width: 80%;
  background: #fff; border: 1px solid var(--rule); border-radius: 10px; padding: 10px 14px; font: 12px/1.4 var(--mono);
  color: var(--text); white-space: pre-wrap; z-index: 9; box-shadow: var(--shadow); }
.rp.gallery > :not(canvas.map) { display: none !important; }
.rp [hidden] { display: none !important; }

/* ---- management zones (only with an imported zone map) */
.rp-zpanel { position: absolute; right: 368px; top: 14px; width: 272px; max-height: calc(100% - 196px); overflow: auto;
  padding: 12px 12px 10px; z-index: 2; scrollbar-width: thin; }
.rp-zpanel[hidden] { display: none; }
.rp-zpanel .ph button { margin-left: auto; }
.ptabs { display: none; }
.lzchips { display: flex; flex-wrap: wrap; gap: 4px 10px; }
.lzchips .lchip { font-size: 11.5px; gap: 5px; }
.lzchips .swatch { width: 12px; height: 12px; border-radius: 3px; }
.zsub { font-size: 11px; color: var(--muted); margin: -4px 2px 8px; line-height: 1.35; overflow-wrap: anywhere; }
.zrow { border: 1px solid var(--rule); border-radius: 11px; padding: 6px 9px 6px; margin-bottom: 6px; background: #fff; }
.zrow.outz { background: var(--bg2); }
.ztop { display: flex; align-items: center; gap: 7px; }
.zsw { display: inline-block; vertical-align: -2px; width: 14px; height: 14px; border-radius: 4px;
  border: 1px solid rgba(0,0,0,.28); flex: none; }
.zname { font-weight: 700; font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  min-width: 0; }
.zbadges { display: inline-flex; gap: 2px; }
.zbadges .num { width: 18px; height: 18px; font-size: 10.5px; border-width: 1.5px; }
.zy { margin-left: auto; white-space: nowrap; font-size: 11px; color: var(--muted); }
.zy b { font-size: 14.5px; font-weight: 800; color: var(--text); font-variant-numeric: tabular-nums; }
.zbar { height: 5px; background: #E5ECF5; border-radius: 99px; overflow: hidden; margin: 5px 0 3px; }
.zbar i { display: block; height: 100%; width: 0; border-radius: 99px; }
.zfoot { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
canvas.zchart { width: 100%; height: 92px; display: block; margin: 2px 0 6px; }
.zopts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 2px 0 8px; }
.zopts .chip { height: 28px; font-size: 11.5px; padding: 0 9px; }
.btn.zask { height: 30px; font-size: 12px; padding: 0 10px; background: var(--navy); color: #fff; border: 0; }
.btn.zask:hover { background: #0A47B3; }
.czone { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--text); font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.czone .zsw { width: 10px; height: 10px; border-radius: 3px; }
.rp-zsheet-h { display: none; }
#rp-zcard { position: absolute; inset: 0; z-index: 8; display: grid; place-items: center; background: rgba(15,23,42,.38); }
#rp-zcard[hidden] { display: none; }
.zcard { width: min(720px, calc(100% - 28px)); max-height: calc(100% - 28px); overflow: auto; padding: 16px 18px 14px;
  background: #fff; border-radius: 16px; box-shadow: var(--shadow); border: 1px solid var(--glass-edge); user-select: text;
  -webkit-user-select: text; }
.zcard h2 { margin: 0; font-size: 17px; color: var(--navy); }
.zcard .zsub { margin: 3px 0 10px; font-size: 12px; }
.zcard .x { position: sticky; top: 0; float: right; margin: -4px -6px 0 8px; }
.zcard table { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; margin: 4px 0 10px; }
.zcard th { text-align: right; font-size: 10.5px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--muted);
  padding: 4px 6px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
.zcard td { text-align: right; padding: 5px 6px; border-bottom: 1px solid #EEF2F7; white-space: nowrap; }
.zcard th:first-child, .zcard td:first-child { text-align: left; }
.zcard tr.outz td { color: var(--muted); font-style: italic; }
.zcard .big { font-size: 14px; line-height: 1.45; margin: 6px 0 8px; color: var(--text); }
.zcard .big b { color: var(--navy); }
.zcard .order { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; margin: 4px 0 10px; }
.zcard .order span { display: inline-flex; align-items: center; gap: 4px; }
.zcard ul { margin: 4px 0 0 0; padding-left: 18px; font-size: 12px; line-height: 1.45; color: var(--muted); }
.zcard h3 { font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 12px 0 2px; }
.zcard .scroll { overflow-x: auto; }
.zcard .yes { color: #00663F; font-weight: 700; } .zcard .no { color: #9A5B00; font-weight: 700; }
.zcard td.wrap { white-space: normal; min-width: 92px; text-align: left; line-height: 1.25; }
/* a medium screen (the app's frame on a laptop): the zones and the combines share the right panel, as two tabs */
@media (min-width: 761px) and (max-width: 1179px) {
  .rp-zpanel { right: 66px; top: 14px; width: 292px; }
  .ptabs { display: flex; margin: 0 0 8px; }
  .ptabs button { flex: 1; }
}

/* ---- narrow (a phone held upright) */
@media (max-width: 760px) {
  .rp-head { left: 10px; top: 10px; padding: 9px 11px 9px 10px; max-width: calc(100% - 70px); gap: 9px; }
  .rp-title { max-width: 230px; font-size: 13.5px; }
  .rp-time { font-size: 24px; }
  .rp-tools { right: 10px; top: 10px; }
  .tbtn { width: 38px; height: 38px; }
  .rp-panel { right: 10px; left: 10px; width: auto; top: auto; bottom: 186px; max-height: 46%; }
  .rp-bar { left: 8px; right: 8px; bottom: 8px; padding: 8px 10px; }
  .rp-legend { left: 8px; width: 200px; padding: 7px 10px; }
  .rp-attr { max-width: calc(100% - 226px); font-size: 9.5px; right: 10px; }
  .rp-legend .lchips { display: none; }
  .rp-legend .lt { font-size: 11.5px; margin-bottom: 4px; }
  .only-wide { display: none !important; }
  .only-narrow { display: inline-flex !important; }
  .ctl { gap: 7px; }
  .seg button { padding: 0 7px; font-size: 12px; }
  canvas.tl { height: 50px; }
  .btn.play { width: 44px; height: 44px; }
  .rp-zpanel { right: 10px; left: 10px; width: auto; top: auto; bottom: 186px; max-height: 46%; padding: 0; }
  .rp-zpanel .zbody { padding: 0 10px 8px; }
  .rp-zpanel.closed .zbody { display: none; }
  .rp-zsheet-h { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: transparent; padding: 9px 12px;
    font-family: inherit; font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--navy);
    cursor: pointer; }
  .rp-zsheet-h .chev { margin-left: auto; transition: transform .15s; }
  .rp-zpanel:not(.closed) .rp-zsheet-h .chev { transform: rotate(180deg); }
  .rp-zpanel .ph.zph { display: none; }
  .rp-zpanel .zbody { display: flex; flex-direction: column; }
  .rp-zpanel .zbody > * { flex: none; }
  .rp-zpanel #zrows { order: -1; margin-top: 2px; }
  .rp-legend .lzchips { display: flex; gap: 3px 8px; }
}
@media (max-width: 760px) and (max-height: 520px) { .rp-panel { bottom: 150px; max-height: 40%; } }
/* ---- edits by hand: the switch, the panel, the card of a reading, the box */
.chip.echip { font-weight: 800; margin-top: 8px; height: 30px; }
.chip.echip.off { color: #8A94A3; border-style: dashed; }
.rp.editing canvas.map { cursor: pointer; }
.rp.editing.boxing canvas.map { cursor: crosshair; }
.rp-card { position: absolute; z-index: 6; width: 312px; padding: 9px 11px 8px; font-size: 12px; line-height: 1.35;
  pointer-events: none; }
.rp-card[hidden], .rp-boxsel[hidden], .rp-boxmenu[hidden] { display: none; }
.rp-card .ch { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; font-size: 12.5px; }
.rp-card .ct { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.rp-card .cr { display: grid; grid-template-columns: 82px 1fr; gap: 6px; padding: 3px 0; border-top: 1px solid var(--rule); }
.rp-card .cr > span:first-child { color: var(--muted); font-weight: 600; }
.rp-card .lim { color: var(--muted); font-size: 11px; display: block; }
.rp-card .out { color: #B00020; }
.rp-card i { color: var(--muted); font-style: normal; }
.rp-card .num, .etab .num { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 4px;
  border-radius: 9px; font-size: 11px; font-weight: 800; color: #111827; }
.sym { display: inline-flex; vertical-align: -2px; margin-right: 4px; }
.ehelp { font-size: 11.5px; color: var(--muted); line-height: 1.38; margin: 0 2px 8px; }
.erow { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.erow .btn, .rp-boxmenu .btn { height: 32px; font-size: 12px; display: inline-flex; align-items: center; gap: 5px; }
.erow .btn svg { width: 15px; height: 15px; }
.btn.on { background: #EAF6FD; border-color: var(--blue); }

  tap = { x, y, t: performance.now(), id: ev.pointerId, multi: ptrs.size > 1 };
  if (S.edit && EDIT_OK && (ev.shiftKey || E.box) && ptrs.size <= 1) {
    E.boxFrom = { x, y }; dragFrom = null; cv.classList.remove("drag"); hideBoxMenu(); E.boxFrom.on = true; showBox(x, y, x, y);
  }
});
cv.addEventListener("pointermove", (ev) => {
  const r = cv.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  if (E.boxFrom && E.boxFrom.on) { dragFrom = null; showBox(E.boxFrom.x, E.boxFrom.y, x, y); return; }
  if (ev.pointerType === "mouse" && !ptrs.size && cardOn()) {
    hoverAt = [x, y];
    if (!hoverRaf) hoverRaf = requestAnimationFrame(() => { hoverRaf = 0; if (!hoverAt || !cardOn()) return; const h = hitAt(hoverAt[0], hoverAt[1]); const same = h && E.card && h.c === E.card.c && h.i === E.card.i; if (!same) { showCard(h, hoverAt[0], hoverAt[1]); S.dirty = true; wake(); } });
  }
});
cv.addEventListener("pointerleave", () => { hoverAt = null; if (E.card && !E.cardPinned) { showCard(null); S.dirty = true; wake(); } });
cv.addEventListener("pointerup", (ev) => {
  const r = cv.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  if (E.boxFrom && E.boxFrom.on) {
    const b = E.boxFrom; E.boxFrom = null;
    if (Math.hypot(x - b.x, y - b.y) < 6) { hideBoxMenu(); return; }
    boxMenu(b.x, b.y, x, y); return;
  }
  const t = tap; tap = null;
  if (!t || t.multi || t.id !== ev.pointerId || Math.hypot(x - t.x, y - t.y) > 6 || performance.now() - t.t > 700) return;
  if (!cardOn()) return;
  const h = hitAt(x, y);
  if (S.edit && EDIT_OK && h) markClick(h.c, h.i);

});
function editKey(ev) {                // Escape: the box menu, the box; Ctrl+Z: undo (edit mode)
  if (!S.edit) return false;
  if (ev.key === "Escape") { if (!$("boxmenu").hidden) hideBoxMenu(); else if (E.box) { E.box = false; root.classList.remove("boxing"); buildEditPanel(); } else showCard(null); return true; }
  if ((ev.ctrlKey || ev.metaKey) && (ev.key === "z" || ev.key === "Z")) { ev.preventDefault(); undo(); return true; }
  return false;
}
if (EDIT_ON) {
  $("b-edit").hidden = false;
  if (!EDIT_OK) { $("b-edit").classList.add("off"); $("b-edit").title = ED.why || "This replay cannot be edited"; }
  $("b-edit").addEventListener("click", () => setEdit(!E.on));
}

cv.addEventListener("dblclick", (ev) => { if (S.edit) return; const r = cv.getBoundingClientRect(); const s0 = scaleAt(S.z);
  const wx = S.cx + (ev.clientX - r.left - S.W / 2) / s0, wy = S.cy - (ev.clientY - r.top - S.H / 2) / s0;
  flyTo(S.cx + (wx - S.cx) * 0.5, S.cy + (wy - S.cy) * 0.5, Math.min(23, S.z + 1), 300); });
window.addEventListener("keydown", (ev) => {
  if (ev.target && /input|select|textarea/i.test(ev.target.tagName)) return;
  if (editKey(ev)) return;
  const k = ev.key;
  if (k === "Enter" && ev.target && ev.target.tagName === "BUTTON") return;   // Enter: the focused button acts
  if (k === "Escape" && HAS_Z && !$("rp-zcard").hidden) { closeZoneCard(); return; }
  if (k === " ") { ev.preventDefault(); if (!ev.repeat) togglePlay(); }
  else if (k === "ArrowLeft") { ev.preventDefault(); step(-1); }
  else if (k === "ArrowRight") { ev.preventDefault(); step(1); }
  else if (k === "+" || k === "=") zoomStep(1);
  else if (k === "-" || k === "_") zoomStep(-1);
  else if (k === "0") { setFollow(0); fit(true); }
  else if (k === "f" || k === "F") $("b-full").click();
  else if (/^[1-9]$/.test(k) && +k <= C.length) setFollow(S.follow === +k ? 0 : +k);
});

/* ------------------------------------------------------------------ size */
function resize() {
  const r = root.getBoundingClientRect();
  S.W = Math.max(1, Math.round(r.width)); S.H = Math.max(1, Math.round(r.height));
  cv.width = Math.round(S.W * DPR); cv.height = Math.round(S.H * DPR);
  for (const l of Object.values(L)) l.ok = false;
  const bar = root.querySelector(".rp-bar").getBoundingClientRect();
  const above = r.bottom - bar.top;
  $("attr").style.bottom = (above + 6) + "px";
  $("legend").style.bottom = (above + 10) + "px";
  // the panels on the right end above the control bar, which wraps onto two rows on a narrower screen
  if (S.W >= 760) $("panel").style.maxHeight = Math.max(120, bar.top - r.top - 14 - 10) + "px"; else $("panel").style.maxHeight = "";
  const sheetOpen = HAS_Z && S.W < 760 && S.zsheet;      // the open zones sheet on a phone takes the legend's place
  $("legend").style.visibility = sheetOpen ? "hidden" : "";
  const ep = $("epanel");                                 // Edit points on a phone: the panel right above the bar
  if (ep && !ep.hidden && S.W < 760) { ep.style.bottom = (above + 8) + "px"; $("legend").style.visibility = "hidden"; }
  else if (ep) ep.style.bottom = "";
  const lg = $("legend").getBoundingClientRect(), lgH = sheetOpen ? 6 : lg.height;   // open: just above the image credit
  let scaleAt_ = above + 10 + lg.height + 14;
  if (HAS_Z) {                     // the zones panel: a sheet above the legend on a phone, under the title on a medium screen
    layoutZones();
    const zp = $("zpanel");
    zp.style.bottom = ""; zp.style.top = ""; zp.style.maxHeight = "";
    if (S.W < 760) {
      zp.style.bottom = (above + 10 + lgH + 8) + "px";
      const tools = root.querySelector(".rp-tools").getBoundingClientRect();
      zp.style.maxHeight = Math.max(120, S.H - (above + 10 + lgH + 8) - (tools.bottom - r.top) - 10) + "px";
      scaleAt_ = above + 10 + lgH + 8 + zp.getBoundingClientRect().height + 8;
    } else {
      zp.style.maxHeight = Math.max(120, bar.top - r.top - 14 - 10) + "px";
    }
  }
  // the image credit: left of a panel that reaches down to the bar (a wide screen), so the panel does not cover it
  let ar = 14;
  if (S.W >= 760) for (const id of ["panel", "zpanel"]) {
    const e = $(id); if (!e || e.hidden) continue;
    const b = e.getBoundingClientRect(); if (b.height && b.bottom > bar.top - 34) ar = Math.max(ar, r.right - b.left + 10);
  }
  $("attr").style.right = ar + "px";
  $("scale").style.bottom = scaleAt_ + "px";
  if (HAS_Z) $("scale").style.visibility = S.W < 760 && S.zsheet ? "hidden" : "";
  S.dirty = true; wake();
}
window.addEventListener("resize", () => { clearTimeout(resize.h); resize.h = setTimeout(resize, 80); });

/* ------------------------------------------------------------------ start: the URL hash sets the state */
function readHash() {
  const h = {}; (location.hash || "").replace(/^#/, "").split("&").forEach((kv) => { if (!kv) return; const [k, v] = kv.split("="); h[decodeURIComponent(k)] = decodeURIComponent(v || ""); });
  return h;
}
$("title").textContent = P.title; $("title").title = P.file;
$("kicker").textContent = KIND === "clean" ? "Harvest replay · cleaning result" : "Harvest replay · readings as imported";
$("zone").textContent = HAS_CLOCK ? "Clock: " + P.basis.zone : "No clock in the file";
$("note").textContent = P.basis.kind === "clock" ? "" : P.basis.note;
buildPanel(); buildSegs(); buildZonePanel();
const H = readHash();
const narrow = window.innerWidth < 760;
S.panel = H.panel !== undefined ? H.panel !== "0" : !narrow;
$("panel").hidden = !S.panel; $("b-panel").classList.toggle("on", S.panel);
S.skipIdle = H.idle !== undefined ? H.idle !== "0" : true; setChip("t-idle", S.skipIdle); buildSegs();
S.ahead = H.ahead === "1"; setChip("t-ahead", S.ahead);
setSpeed(H.speed ? (H.speed === "min" ? "min" : +H.speed) : 60);
if (HAS_Z) {
  S.zborders = H.zb === "1"; setChip("t-zb", S.zborders); S.zborder = H.zbd === "1"; setChip("t-zbd", S.zborder);
  S.zsheet = H.zs === "1"; S.ptab = H.ptab === "combines" ? "combines" : "zones"; setView(H.view === "yield" ? "yield" : "zones");
}
setMode(H.c && MODES.find((m) => m[0] === H.c) ? H.c : "yield");
resize(); fit(false);
if (H.z) { S.z = Math.max(3, Math.min(23, +H.z)); }
if (H.lat && H.lon) { S.cx = mx(+H.lon); S.cy = my(+H.lat); }
if (H.at !== undefined) seek(+H.at); else if (H.t !== undefined) seek(uToT(Math.max(0, Math.min(1, +H.t)))); else seek(0);
if (H.f && +H.f > 0 && +H.f <= C.length) {
  S.follow = +H.f; $("follow").value = H.f; C.forEach((c) => $("cmb" + c.num).classList.toggle("followed", c.num === S.follow));
  const m = machineState(C[S.follow - 1], S.t);
  if (m.show) { if (!H.z) S.z = 18.6; const [x, y] = followTarget(m); S.cx = x; S.cy = y; }
}
S.playing = H.play === "1"; setPlayIcon();
if (S.playing && H.stop) {          // #play=1&stop=2: play for 2 s, then hold that moment as it is (for pictures)
  setTimeout(() => { S.playing = false; S.frozen = true; setPlayIcon(); S.dirty = true; wake(); }, +H.stop * 1000);
}
if (H.bench) {
  try { bench(+H.bench || 300, H.t !== undefined ? +H.t : 0.05, H.f ? +H.f : 0); }
  catch (e) { S.playing = false; S.benched = true; $("rp-stats").textContent = "bench error: " + e.message + " | " + (e.stack || ""); $("rp-stats").style.display = "block"; }
}
if (HAS_Z && H.card === "1") openZoneCard();
if (HAS_Z && H.zcheck) zoneCheck();
if (H.gallery) { S.gallery = true; S.galleryAnim = H.anim !== "0"; root.classList.add("gallery"); }
S.dirty = true; wake();

/* a measured run for the tests and the report: n frames at 1200x (rendering only, no waiting) */
function bench(n, u, follow) {
  const sp = S.speed; S.speed = 1200; S.playing = true; S.bench = true; resize(); fit(false); seek(uToT(u));
  if (follow) { S.follow = follow; S.z = 18.6; }
  const tStart = performance.now(); let worst = 0, sum = 0; const per = [];
  for (let k = 0; k < n; k++) { const a = performance.now(); lastFrame = a - 1000 / 60; raf = 0; frame(a); const ms = performance.now() - a; per.push(ms); sum += ms; worst = Math.max(worst, ms); }
  cancelAnimationFrame(raf); raf = 0; chaff.length = 0;
  per.sort((a, b) => a - b);
  const r0 = performance.now(); S.groundDirty = true; paintGround(); const full = performance.now() - r0;
  $("rp-stats").textContent = JSON.stringify({ bench: n, readings: stats.n, mean_ms: +(sum / n).toFixed(2), p50_ms: +per[Math.floor(n / 2)].toFixed(2),
    p95_ms: +per[Math.floor(n * 0.95)].toFixed(2), max_ms: +worst.toFixed(2), full_ground_repaint_ms: +full.toFixed(1), total_ms: +(performance.now() - tStart).toFixed(0),
    from_u: u, played_to: clockParts(S.t).time, follow: follow || 0, W: S.W, H: S.H, dpr: DPR,
    painted: C.reduce((a, c) => a + c.idx + 1, 0) });
  $("rp-stats").style.display = "block"; S.benched = true; console.log("BENCH end", $("rp-stats").textContent);
  S.speed = sp; S.playing = false; setPlayIcon();
}
/* the running numbers of the management zones checked in the browser (#zcheck=1): after seeks backwards and forwards
   each zone's running sums are compared with a sum over every reading reached; then the timeline is played to the end
   at several speeds, 'skip idle time' on and off, and the end compared with the final statistics computed in Python */
function zoneCheck() {
  const brute = () => {
    const out = []; for (let k = 0; k <= ZK; k++) out.push({ n: 0, A: 0, B: 0 });
    C.forEach((c) => {
      if (!c.zb) return;
      for (let i = 0; i <= c.idx; i++) {
        if ((c.f[i] & 2) || ((c.zb[i] & 1) && !S.zborder)) continue;
        const g = c.zg[c.zb[i]], o = out[c.zb[i] >> 1], y = c.y[i];          // the same scale as the running sums
        o.n++; o.A += c.A[i] * g.kA; if (y === y) o.B += y * c.A[i] * g.kB;
      }
    });
    return out;
  };
  const rel = (a, b) => Math.abs(a - b) / Math.max(1e-12, Math.abs(b));
  const res = { seeks: 0, seek_max_rel_A: 0, seek_max_rel_B: 0, seek_max_dn: 0, seek_backwards: 0 };
  let u = 0.37, prevT = 0;
  for (let j = 0; j < 40; j++) {
    u = (u * 7.31 + 0.137) % 1; seek(uToT(j % 5 === 4 ? 0 : u));
    if (S.t < prevT) res.seek_backwards++;
    prevT = S.t;
    S.zborder = j % 2 === 1;
    const R = zoneRun(S.zborder), Bf = brute();
    for (let k = 0; k <= ZK; k++) {
      if (Bf[k].A > 0) res.seek_max_rel_A = Math.max(res.seek_max_rel_A, rel(R[k].A, Bf[k].A));
      if (Bf[k].B > 0) res.seek_max_rel_B = Math.max(res.seek_max_rel_B, rel(R[k].B, Bf[k].B));
      if (P.thin === 1) res.seek_max_dn = Math.max(res.seek_max_dn, Math.abs(R[k].n - Bf[k].n));
    }
    res.seeks++;
  }
  // played to the end through the frames, at several speeds, 'skip idle time' both ways
  const plays = [];
  for (const [sp, skip] of [[1200, true], ["min", false], [300, true]]) {
    S.speed = sp; S.skipIdle = skip; buildSegs(); seek(uToT(0.2)); S.playing = true; S.bench = true;
    let guard = 0;
    while (S.playing && guard++ < 400000) { const a = performance.now(); lastFrame = a - 250; raf = 0; frame(a); }
    cancelAnimationFrame(raf); raf = 0; chaff.length = 0;
    plays.push({ speed: sp, skip_idle: skip, frames: guard, at_end: S.t >= T_END - 1e-6, every_reading: C.every((c) => c.idx === c.n - 1) });
  }
  const fin = {};
  for (const ver of ["interior", "all"]) {
    const R = zoneRun(ver === "all"), F = ZM.stats[ver].zones;
    let mA = 0, mB = 0, mY = 0, mM = 0, mS = 0, mN = 0, shown = 0;
    for (let k = 0; k <= ZK; k++) {
      const f = F[k]; if (!f) continue;
      mN = Math.max(mN, Math.abs(R[k].n - f.n));
      if (f.acres > 0) mA = Math.max(mA, rel(R[k].A, f.acres));
      if (f.bu > 0) mB = Math.max(mB, rel(R[k].B, f.bu));
      if (f.yield !== null) { mY = Math.max(mY, rel(R[k].yield, f.yield)); if (fmt(R[k].yield, 1) !== fmt(f.yield, 1)) shown++; }
      if (f.mean !== null) mM = Math.max(mM, rel(R[k].mean, f.mean));
      if (f.sd !== null && f.sd > 0) mS = Math.max(mS, rel(R[k].sd, f.sd));
    }
    fin[ver] = { max_rel_acres: mA, max_rel_bu: mB, max_rel_yield: mY, max_rel_mean: mM, max_rel_sd: mS,
      max_abs_readings: mN, shown_yields_differing: shown };
  }
  S.zborder = false; S.bench = false;
  const out = Object.assign({ zcheck: true, zones: ZK, combines: C.length, thin: P.thin }, res, { plays, end: fin });
  $("rp-stats").textContent = JSON.stringify(out); $("rp-stats").style.display = "block"; S.benched = true;
  console.log("ZCHECK", JSON.stringify(out));
}

window.__replay = { S, C, P, stats, seek, setMode, setFollow, fit, bench, setView, zoneRun, openZoneCard, zoomStep, togglePlay,
  edit: { set: setEdit, click: (num, i) => markClick(C[num - 1], i), box: (x0, y0, x1, y1) => inBox(x0, y0, x1, y1), apply: boxApply, menu: boxMenu,
    marks: marksOut, undo, clear: clearMarks, reprocess, hit: hitAt, card: (num, i) => cardHtml(C[num - 1], i),
    show: showCard, posted: E.posted, on: () => E.on, ok: EDIT_OK, centre: (num, i) => { const c = C[num - 1], [x, y] = centreOf(c, i), sc = scaleAt(S.z); return [(x - S.cx) * sc + S.W / 2, (S.cy - y) * sc + S.H / 2]; } },
  zoomTarget: () => (fly ? fly.b.z : S.z),
  zoneCheck: HAS_Z ? zoneCheck : null };
})();
